name: Release desktop app

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$RELEASE_TAG" --check
      - name: Create draft GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "DiffChecker $RELEASE_TAG" --generate-notes --draft
          fi
          echo "draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--debug --target aarch64-apple-darwin'
            artifact: diffchecker-macos-arm64
            bundles: src-tauri/target/aarch64-apple-darwin/debug/bundle/dmg/*.dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--debug --target x86_64-apple-darwin'
            artifact: diffchecker-macos-intel
            bundles: src-tauri/target/x86_64-apple-darwin/debug/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            target: ''
            args: '--debug'
            artifact: diffchecker-linux-x64
            bundles: |
              src-tauri/target/debug/bundle/deb/*.deb
              src-tauri/target/debug/bundle/rpm/*.rpm
              src-tauri/target/debug/bundle/appimage/*.AppImage
          - platform: windows-latest
            target: ''
            args: '--debug'
            artifact: diffchecker-windows-x64
            bundles: |
              src-tauri/target/debug/bundle/msi/*.msi
              src-tauri/target/debug/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Set version from Git tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$RELEASE_TAG"
        shell: bash
      - name: Build desktop installers
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}
      - name: Save desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gather installers
        uses: actions/download-artifact@v4
        with:
          pattern: diffchecker-*
          path: release-assets
          merge-multiple: true
      - name: Upload installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' -t assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "No installers were downloaded" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$RELEASE_TAG" "$asset" --clobber > upload.log 2>&1; then
                uploaded=true
                echo "Uploaded $(basename "$asset")"
                break
              fi
              echo "Upload attempt $attempt failed for $(basename "$asset")" >&2
              head -c 1000 upload.log >&2
              echo >&2
              sleep $((attempt * 15))
            done
            if [[ "$uploaded" != true ]]; then exit 1; fi
          done
      - name: Publish complete release
        if: needs.prepare.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
