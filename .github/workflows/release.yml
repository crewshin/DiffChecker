name: Release desktop app

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$RELEASE_TAG" --check
      - name: Create draft GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "DiffChecker $RELEASE_TAG" --generate-notes --draft
          fi
          echo "draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--debug --target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--debug --target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: ''
            args: '--debug'
          - platform: windows-latest
            target: ''
            args: '--debug'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Set version from Git tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$RELEASE_TAG"
        shell: bash
      - name: Build and upload desktop installers
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: ${{ needs.prepare.outputs.draft }}
          args: ${{ matrix.args }}

  publish:
    if: needs.prepare.outputs.draft == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
